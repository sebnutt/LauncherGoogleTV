name: Build Android TV Launcher APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK and Build APK
      run: |
        # Téléchargement et installation manuelle des outils en ligne de commande Android
        mkdir -p $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        
        # Configuration des variables d'environnement
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # Acceptation des licences et installation des composants SDK requis
        yes | sdkmanager --licenses > /dev/null
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        
        # Configuration de local.properties et lancement du build Gradle
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        sudo apt-get update && sudo apt-get install -y gradle
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: custom-tv-launcher-debug
        path: app/build/outputs/apk/debug/app-debug.apk
